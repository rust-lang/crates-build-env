---

name: CI
on:
  push:
    branches:
      - master
  pull_request: {}

concurrency:
  group: ${{ format('{0}/{1}', github.repository_owner, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v7

      - name: Run the custom linter
        run: ./lint.sh

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint]

    # Use the same job to build all Linux-based images
    strategy:
      matrix:
        image:
          - linux
          - linux-micro

    steps:
      - name: Checkout the source code
        uses: actions/checkout@v7

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: latest

      - name: Test image with Rustwide
        run: ./test_build.sh "${{ matrix.image }}" test/test-crate

      - name: Push tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          LOCAL_IMAGE: crates-build-env-${{ matrix.image }}:local
          REMOTE_IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker tag "${LOCAL_IMAGE}" "${REMOTE_IMAGE}"
          docker push "${REMOTE_IMAGE}"
